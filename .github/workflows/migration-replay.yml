name: OFOQ clean PostgreSQL migration replay

on:
  push:
    branches:
      - ofoq/ofoq-001-execution
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "tests/nibras-rate-limit-concurrency.sh"
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/config.toml"
      - "supabase/seed.sql"
      - "tests/nibras-rate-limit-concurrency.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofoq-migration-replay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  replay-all-migrations:
    name: Replay all migrations on disposable local Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.72.7

      - name: Generate ephemeral local Supabase configuration
        run: supabase init --force

      - name: Start disposable local Supabase stack
        run: supabase start -x studio,inbucket

      - name: Replay every migration from an empty local database
        run: supabase db reset --local

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Assert migration history and critical objects
        shell: bash
        run: |
          set -euo pipefail
          export PGPASSWORD=postgres
          DB=(psql --host 127.0.0.1 --port 54322 --username postgres --dbname postgres --no-psqlrc --set ON_ERROR_STOP=1 --tuples-only --no-align)
          migration_count="$("${DB[@]}" --command "select count(*) from supabase_migrations.schema_migrations;")"
          recovered_count="$("${DB[@]}" --command "select count(*) from supabase_migrations.schema_migrations where version in ('20261109161357','20261109161417','20261109161525','20261109161555','20261109161635','20261109173150','20261109173201','20261110063058','20261110161112','20261110161138','20261111120208','20261111124712','20261111124728','20261111124846');")"
          printf 'Applied migration count: %s\nRecovered migration count: %s\n' "$migration_count" "$recovered_count"
          test "$migration_count" = "39"
          test "$recovered_count" = "14"
          "${DB[@]}" --command "select to_regclass('public.entitlements') is not null and to_regclass('public.points_ledger') is not null and to_regclass('public.points_balances') is not null;" | grep -qx t
          "${DB[@]}" --command "select to_regclass('public.ai_provider_daily_usage') is not null and to_regprocedure('public.reserve_ai_provider_request(text,integer)') is not null;" | grep -qx t
          "${DB[@]}" --command "select to_regclass('public.site_assistant_rate_limits') is not null and to_regprocedure('public.reserve_site_assistant_rate_limit(text,integer,integer)') is not null and to_regprocedure('public.is_ofoq_owner()') is not null;" | grep -qx t
          "${DB[@]}" --command "select relrowsecurity from pg_class where oid='public.site_assistant_rate_limits'::regclass;" | grep -qx t
          "${DB[@]}" --command "select not has_table_privilege('anon','public.site_assistant_rate_limits','SELECT') and not has_table_privilege('authenticated','public.site_assistant_rate_limits','SELECT') and has_table_privilege('service_role','public.site_assistant_rate_limits','SELECT');" | grep -qx t
          "${DB[@]}" --command "select not has_function_privilege('anon','public.reserve_site_assistant_rate_limit(text,integer,integer)','EXECUTE') and not has_function_privilege('authenticated','public.reserve_site_assistant_rate_limit(text,integer,integer)','EXECUTE') and has_function_privilege('service_role','public.reserve_site_assistant_rate_limit(text,integer,integer)','EXECUTE');" | grep -qx t
          "${DB[@]}" --command "DO \$\$ DECLARE allowed_count integer := 0; i integer; BEGIN FOR i IN 1..13 LOOP IF public.reserve_site_assistant_rate_limit(repeat('a',64),60,12) THEN allowed_count := allowed_count + 1; END IF; END LOOP; IF allowed_count <> 12 THEN RAISE EXCEPTION 'Nibras limiter allowed % requests; expected 12', allowed_count; END IF; IF public.reserve_site_assistant_rate_limit('invalid',60,12) THEN RAISE EXCEPTION 'Nibras limiter accepted an invalid bucket key'; END IF; END \$\$;"
          "${DB[@]}" --command "select to_regclass('public.inventory_movements') is not null and to_regclass('public.inventory_items') is not null and to_regclass('public.accounting_accounts') is not null and to_regclass('public.journal_entries') is not null and to_regclass('public.journal_lines') is not null and to_regclass('public.membership_plans') is not null and to_regprocedure('public.post_journal_entry(uuid)') is not null;" | grep -qx t
          "${DB[@]}" --command "select count(*) = 11 and bool_and(relrowsecurity) from pg_class where oid in (to_regclass('public.membership_plans'),to_regclass('public.entitlements'),to_regclass('public.points_ledger'),to_regclass('public.profiles'),to_regclass('public.subscriptions'),to_regclass('public.inventory_items'),to_regclass('public.inventory_movements'),to_regclass('public.accounting_accounts'),to_regclass('public.journal_entries'),to_regclass('public.journal_lines'),to_regclass('public.ai_provider_daily_usage'));" | grep -qx t
          "${DB[@]}" --command "select exists(select 1 from pg_trigger where tgrelid='public.inventory_movements'::regclass and tgname='inventory_movement_apply' and not tgisinternal) and exists(select 1 from pg_trigger where tgrelid='public.journal_entries'::regclass and tgname='validate_journal_entry_status' and not tgisinternal);" | grep -qx t
          "${DB[@]}" --command "select to_regprocedure('public.football_api_budget_reserve(text,text)') is not null and to_regprocedure('public.football_api_budget_status()') is not null;" | grep -qx t
          "${DB[@]}" --command "select provider_blocked from public.football_api_budget_policy where singleton = true;" | grep -qx t
          echo "PASS: all 38 migrations replayed; all 14 recovered versions present; critical football guard functions and blocked-provider policy exist."

      - name: Verify owner-only RLS helper and policy coverage
        env:
          PGPASSWORD: postgres
        run: |
          psql --no-psqlrc --set ON_ERROR_STOP=1 --host 127.0.0.1 --port 54322 --username postgres --dbname postgres <<'SQL'
          DO $$
          DECLARE
            uncovered integer;
          BEGIN
            PERFORM set_config('request.jwt.claims', '{"app_metadata":{"role":"OWNER","owner":true,"owner_access":"lifetime"}}', true);
            IF public.is_ofoq_owner() IS DISTINCT FROM true THEN
              RAISE EXCEPTION 'owner metadata must pass is_ofoq_owner()';
            END IF;
            PERFORM set_config('request.jwt.claims', '{"app_metadata":{"role":"USER","owner":false}}', true);
            IF public.is_ofoq_owner() IS DISTINCT FROM false THEN
              RAISE EXCEPTION 'non-owner metadata must fail is_ofoq_owner()';
            END IF;
            IF has_function_privilege('anon', 'public.is_ofoq_owner()', 'EXECUTE') THEN
              RAISE EXCEPTION 'anon must not execute is_ofoq_owner()';
            END IF;
            IF NOT has_function_privilege('authenticated', 'public.is_ofoq_owner()', 'EXECUTE') THEN
              RAISE EXCEPTION 'authenticated must execute is_ofoq_owner() for RLS evaluation';
            END IF;
            SELECT count(*) INTO uncovered
            FROM pg_policies
            WHERE schemaname = 'public'
              AND roles @> ARRAY['authenticated']::name[]
              AND tablename NOT IN ('membership_plans', 'payment_methods')
              AND (
                (qual IS NOT NULL AND position('is_ofoq_owner' in qual) = 0)
                OR (with_check IS NOT NULL AND position('is_ofoq_owner' in with_check) = 0)
                OR (qual IS NULL AND cmd IN ('SELECT','UPDATE','DELETE','ALL'))
                OR (with_check IS NULL AND cmd IN ('INSERT','UPDATE','ALL'))
              );
            IF uncovered <> 0 THEN
              RAISE EXCEPTION 'found % authenticated policies without owner guard', uncovered;
            END IF;
          END;
          $$;
          SQL

      - name: Test Nibras atomic minute limiter under concurrency
        run: bash tests/nibras-rate-limit-concurrency.sh

      - name: Stop disposable local Supabase stack
        if: always()
        run: supabase stop --no-backup
