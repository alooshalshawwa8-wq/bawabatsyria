name: Validate membership and portal code

on:
  push:
    branches:
      - "**"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ofoq-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check membership Worker syntax
        run: node --input-type=module --check < backend/worker.js
      - name: Run membership API security contract tests
        run: node tests/membership-api-contract.mjs
      - name: Check portal inline JavaScript
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          html = Path("index.html").read_text(encoding="utf-8")
          script_tags = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, re.I)
          scripts = []
          for attrs, body in script_tags:
              if re.search(r'type\s*=\s*["\']application/ld\+json["\']', attrs, re.I):
                  json.loads(body)
                  continue
              scripts.append(body)
          if not scripts:
              raise SystemExit("No inline script found")
          Path("/tmp/portal.js").write_text("\n".join(scripts), encoding="utf-8")
          PY
          node --check /tmp/portal.js
      - name: Validate D1 schema with SQLite
        run: |
          python3 - <<'PY'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(":memory:")
          db.executescript(Path("backend/schema.sql").read_text(encoding="utf-8"))
          expected = {"subscriptions", "entitlements", "points_ledger", "checkout_sessions"}
          actual = {row[0] for row in db.execute("SELECT name FROM sqlite_master WHERE type='table'")}
          missing = expected - actual
          if missing:
              raise SystemExit("Missing tables: " + ", ".join(sorted(missing)))
          print("D1 schema tables validated.")
          PY
      - name: Check e-commerce studio JavaScript
        run: node --check ecommerce-studio.js
      - name: Check career studio JavaScript
        run: node --check career-studio.js
      - name: Check operations hub JavaScript
        run: node --check operations-hub.js
      - name: Run OFOQ portal contract tests
        run: python3 scripts/validate_ofoq.py
      - name: Install Playwright browser test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run browser smoke tests against branch preview
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/ofoq-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          OFOQ_BASE_URL=http://127.0.0.1:8765/ node tests/browser-smoke.mjs
          OFOQ_BASE_URL=http://127.0.0.1:8765/ node tests/mobile-smoke.mjs
