name: OFOQ full Git history secret scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "27 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ofoq-secret-history-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan-history:
    name: Scan every reachable commit for exposed credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out full Git history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.11"
          cache: false

      - name: Install pinned Gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Scan all reachable Git history
        run: |
          gitleaks git --log-opts="--all" --redact=100 --no-banner .
