name: OFOQ static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check service-worker.js
          node --check ecommerce-studio.js
          node --check career-studio.js
          node --check operations-hub.js
          node --check ofoq-core.js
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/site-assistant/index.ts
          deno check supabase/functions/membership-api/index.ts
          deno check supabase/functions/football-data/index.ts
      - name: Validate static app contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const read = path => fs.readFileSync(path, 'utf8');
          const html = read('index.html');
          const manifest = JSON.parse(read('manifest.json'));
          const sitemap = read('sitemap.xml');
          const worker = read('service-worker.js');
          const assistant = read('supabase/functions/site-assistant/index.ts');
          const football = read('supabase/functions/football-data/index.ts');
          const membership = read('supabase/functions/membership-api/index.ts');
          const base = 'https://alooshalshawwa8-wq.github.io/bawabatsyria/';

          assert.ok(html.includes('<html lang="ar" dir="rtl">'), 'Arabic RTL document metadata missing');
          assert.ok(html.includes('</title>'), 'Document title missing');
          assert.ok(html.includes('<link rel="canonical" href="' + base + '">'), 'Canonical URL missing');
          assert.equal(manifest.lang, 'ar', 'Manifest language must be Arabic');
          assert.equal(manifest.dir, 'rtl', 'Manifest direction must be RTL');
          assert.ok(Array.isArray(manifest.icons) && manifest.icons.length, 'Manifest icon missing');

          const marker = '<script type="application/ld+json">';
          const jsonStart = html.indexOf(marker);
          assert.notEqual(jsonStart, -1, 'Structured data block missing');
          const jsonEnd = html.indexOf('</script>', jsonStart);
          assert.ok(jsonEnd > jsonStart, 'Structured data block is not closed');
          JSON.parse(html.slice(jsonStart + marker.length, jsonEnd));

          for (const file of ['ecommerce-studio.js', 'career-studio.js', 'operations-hub.js', 'ofoq-core.js']) {
            assert.ok(html.includes('src="./' + file + '"'), 'Script not referenced by index.html: ' + file);
            assert.ok(fs.existsSync(file), 'Missing local script: ' + file);
          }

          const iconPath = manifest.icons[0].src.replace('./', '');
          assert.ok(fs.existsSync(iconPath), 'Missing manifest icon: ' + iconPath);
          for (const image of [
            'assets/file_00000000dce882129102a05013969410.png',
            'assets/file_000000008668821282987c991b233d13.png'
          ]) assert.ok(fs.existsSync(image), 'Missing welcome image: ' + image);
          assert.ok(!html.includes('ofoq-founder.jpg'), 'Broken founder avatar reference remains');
          assert.ok(!html.includes('file_00000000dce882129102a05013969410-480.webp'), 'Missing WebP variant referenced by page');
          assert.ok(html.includes("navigator.serviceWorker.register('./service-worker.js')"), 'Service worker registration missing');
          assert.ok(fs.existsSync('service-worker.js'), 'Registered service worker file missing');

          const appFilesBlock = worker.split('const APP_FILES = [')[1]?.split('];')[0];
          assert.ok(appFilesBlock, 'Service worker app shell list missing');
          const appFiles = appFilesBlock.split('"').filter((_, index) => index % 2 === 1);
          for (const file of appFiles) {
            const localPath = file.replace('./', '') || 'index.html';
            assert.ok(fs.existsSync(localPath), 'Missing cached app shell file: ' + file);
          }

          assert.ok(worker.includes('key.startsWith(CACHE_PREFIX)'), 'Cache cleanup must be scoped to OFOQ caches');
          assert.ok(worker.includes('request.destination'), 'Static asset caching must be destination-scoped');
          assert.ok(assistant.includes('readBoundedBody(request, 24_000)'), 'Assistant request body must be size-bounded while streaming');
          assert.ok(assistant.includes('BODY_TOO_LARGE'), 'Assistant must reject oversized request bodies');
          assert.ok(assistant.includes('hits.size >= 10_000'), 'Assistant rate limiter state must be bounded');
          assert.ok(football.includes('requests.size >= 10_000'), 'Football rate limiter state must be bounded');
          assert.ok(football.includes('lastRateMapPruneAt >= 60_000'), 'Football rate limiter must prune expired clients');
          assert.ok(membership.includes('readBoundedText(request, 262_144)'), 'Stripe webhook body must be bounded');
          assert.ok(membership.includes('readBoundedText(request, 8_192)'), 'Membership JSON bodies must be bounded');
          assert.ok(sitemap.includes(base), 'Sitemap must contain the canonical site URL');
          console.log('OFOQ static contracts passed.');
          NODE
