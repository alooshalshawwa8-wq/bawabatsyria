name: OFOQ static validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check service-worker.js
          node --check ecommerce-studio.js
          node --check career-studio.js
          node --check operations-hub.js
          node --check ofoq-core.js
      - name: Validate static app contracts
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';

          const read = path => fs.readFileSync(path, 'utf8');
          const html = read('index.html');
          const manifest = JSON.parse(read('manifest.json'));
          const sitemap = read('sitemap.xml');
          const worker = read('service-worker.js');
          const base = 'https://alooshalshawwa8-wq.github.io/bawabatsyria/';

          assert.match(html, /<html[^>]+lang="ar"[^>]+dir="rtl"/i, 'Arabic RTL document metadata missing');
          assert.match(html, /<title>[^<]+<\\/title>/i, 'Document title missing');
          assert.match(html, new RegExp('<link[^>]+rel="canonical"[^>]+href="' + base.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&') + '"'), 'Canonical URL missing');
          assert.equal(manifest.lang, 'ar', 'Manifest language must be Arabic');
          assert.equal(manifest.dir, 'rtl', 'Manifest direction must be RTL');
          assert.ok(Array.isArray(manifest.icons) && manifest.icons.length, 'Manifest icon missing');

          const jsonLd = [...html.matchAll(/<script type="application\\/ld\\+json">([\\s\\S]*?)<\\/script>/gi)];
          assert.ok(jsonLd.length, 'Structured data block missing');
          for (const block of jsonLd) JSON.parse(block[1]);

          const localScripts = [...html.matchAll(/<script[^>]+src=["']\\.\\/([^"']+)["']/gi)].map(match => match[1]);
          for (const file of localScripts) assert.ok(fs.existsSync(file), 'Missing local script: ' + file);

          const iconPath = manifest.icons[0].src.replace(/^\\.\\//, '');
          assert.ok(fs.existsSync(iconPath), 'Missing manifest icon: ' + iconPath);
          assert.match(html, /navigator\\.serviceWorker\\.register\\(['"]\\.\\/service-worker\\.js['"]\\)/, 'Service worker registration missing');
          assert.ok(fs.existsSync('service-worker.js'), 'Registered service worker file missing');

          const appFilesMatch = worker.match(/const APP_FILES = \\[([\\s\\S]*?)\\];/);
          assert.ok(appFilesMatch, 'Service worker app shell list missing');
          const appFiles = [...appFilesMatch[1].matchAll(/["']([^"']+)["']/g)].map(match => match[1]);
          for (const file of appFiles) assert.ok(fs.existsSync(file.replace(/^\\.\\//, '') || 'index.html'), 'Missing cached app shell file: ' + file);

          assert.match(worker, /key\\.startsWith\\(CACHE_PREFIX\\)/, 'Cache cleanup must be scoped to OFOQ caches');
          assert.match(worker, /request\\.destination/, 'Static asset caching must be destination-scoped');
          assert.match(sitemap, new RegExp(base.replace(/[.*+?^${}()|[\\]\\\\]/g, '\\\\$&')), 'Sitemap must contain the canonical site URL');
          console.log('OFOQ static contracts passed.');
          NODE
