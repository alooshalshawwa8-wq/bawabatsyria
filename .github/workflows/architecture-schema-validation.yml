name: Architecture contract schema validation
on:
  push:
    branches: [docs/target-architecture-v1-1]
    paths:
      - "schemas/**"
      - "tests/architecture-schema-validation.py"
      - ".github/workflows/architecture-schema-validation.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-schemas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install jsonschema
      - name: Validate schemas and contract samples
        run: python tests/architecture-schema-validation.py
