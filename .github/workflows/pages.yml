name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Validate site files and JavaScript
        run: |
          test -f index.html
          test -f manifest.json
          test -f service-worker.js
          test -f ofoq-core.js
          python3 - <<'PY'
          import json, re
          from html.parser import HTMLParser
          from pathlib import Path

          root = Path(".")
          html = (root / "index.html").read_text(encoding="utf-8")
          json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          structured_data = re.findall(r'<script\b[^>]*type=["\']application/ld\+json["\'][^>]*>([\s\S]*?)</script>', html, re.I)
          if not structured_data:
              raise SystemExit("Missing JSON-LD structured data")
          for block in structured_data:
              json.loads(block)
          print(f"Validated {len(structured_data)} JSON-LD block(s).")

          script_tags = re.findall(r"<script\b([^>]*)>([\s\S]*?)</script>", html, re.I)
          scripts = []
          for attrs, body in script_tags:
              if re.search(r'type\s*=\s*["\']application/ld\+json["\']', attrs, re.I):
                  json.loads(body)
                  continue
              scripts.append(body)
          if not scripts:
              raise SystemExit("No inline JavaScript found in index.html")
          Path("/tmp/site-inline.js").write_text("\n".join(scripts), encoding="utf-8")

          class AssetChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.missing = []
              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key not in ("src", "href") or not value:
                          continue
                      value = value.strip()
                      if value.startswith(("#", "http://", "https://", "data:", "mailto:", "tel:", "javascript:")):
                          continue
                      path = value.split("?", 1)[0].split("#", 1)[0]
                      if path and not (root / path).exists():
                          self.missing.append((tag, key, value))

          checker = AssetChecker()
          checker.feed(html)
          if checker.missing:
              raise SystemExit("Missing local assets: " + repr(checker.missing))
          print("HTML assets and manifest checks passed.")
          PY
          node --check /tmp/site-inline.js
          python3 - <<'PY'
          import re
          from pathlib import Path

          html = Path("index.html").read_text(encoding="utf-8")
          start = html.index("const sections = [")
          end = html.index("\n\n]", start)
          section_block = html[start:end]
          ids = re.findall(r"\{\s*id:\s*'([^']+)'", section_block)
          if not ids:
              raise SystemExit("Section registry could not be parsed")
          if len(ids) != len(set(ids)):
              raise SystemExit("Duplicate section IDs found")

          pstart = html.index("const sectionPriority = [")
          pend = html.index("];", pstart)
          priority = re.findall(r'"([^"]+)"', html[pstart:pend])
          if len(priority) != len(set(priority)):
              raise SystemExit("Duplicate section priority entries found")
          if set(priority) != set(ids):
              raise SystemExit("Section priority mismatch; missing=" + repr(sorted(set(ids)-set(priority))) + " unknown=" + repr(sorted(set(priority)-set(ids))))

          ustart = html.index("const utilityModules=")
          uend = html.index("function renderUtilityModule", ustart)
          utility_ids = set(re.findall(r"^\s*([a-z0-9_]+):\s*\{", html[ustart:uend], re.M))
          astart = html.index("Object.assign(utilityModules")
          aend = html.index("function renderSectionWorkspace", astart)
          utility_ids.update(re.findall(r"^\s*([a-z0-9_]+):\s*\{", html[astart:aend], re.M))

          ostart = html.index("async function openSection")
          oend = html.index("function showHome", ostart)
          opener = html[ostart:oend]
          special_ids = set(re.findall(r"(?:if|else if)\s*\(\s*sec\.id\s*===\s*'([^']+)'", opener))
          uncovered = set(ids) - utility_ids - special_ids
          if uncovered:
              raise SystemExit("Sections without a renderer: " + repr(sorted(uncovered)))
          if "renderSectionWorkspace(sec,tool);" not in opener or "appendFreeAIHelper(sec,tool);" not in opener:
              raise SystemExit("Shared workspace or section AI helper is not attached to every opened section")
          for required in ("🧰 أدوات القسم", "🗂️ خطة التنفيذ", "📝 ملاحظاتي"):
              if required not in html:
                  raise SystemExit("Missing workspace feature: " + required)
          print(f"Section audit passed: {len(ids)} unique sections, {len(priority)} priority entries, all sections mapped to a renderer and shared workspace.")
          PY
          node --check service-worker.js
          node --check ofoq-core.js
          node --check tests/browser-smoke.mjs
      - name: Check e-commerce studio JavaScript
        run: node --check ecommerce-studio.js
      - name: Check career studio JavaScript
        run: node --check career-studio.js
      - name: Run OFOQ portal contract tests
        run: python3 scripts/validate_ofoq.py
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Browser smoke tests (all sections and key controls)
        timeout-minutes: 12
        env:
          OFOQ_BASE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          npm install --no-save --no-package-lock playwright@1.65.0
          PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT=30000 npx --no-install playwright install --only-shell chromium
          node tests/browser-smoke.mjs
